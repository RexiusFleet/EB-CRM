      '<div class="fld"><label>Contact</label><input class="in" id="bill-cust-contact" value="' + esc(c.contact || "") + '"></div></div>' +
      '<div class="fld"><label>Billing address</label><input class="in" id="bill-cust-baddr" value="' + esc(c.billingAddress || "") + '"></div>' +
      '<button class="btn sm primary" data-act="bill-cust-save" data-id="' + esc(customerId) + '">Save customer info</button> ' +
      '<button class="btn sm ghost" data-act="bill-cust-collapse">Cancel</button>' +
      "</td></tr>";
  }
  function renderBilling(v) {
    var ym = ui.billMonth;
    var newList = newRentalsForMonth(ym);
    var retList = returnsForMonth(ym);
    var pendingList = state.rentals.filter(function (r) { return needsRecurringVisible(r, ym); })
      .sort(function (a, b) { return a.startDate.localeCompare(b.startDate); });
    var roster = recurringRoster(ym);

    /* Stage 1: new rentals */
    var newRows = newList.map(function (r) {
      var existingInv = state.invoices.find(function (i) { return i.rentalId === r.id && i.kind === "initial"; });
      var prorate = nextMonthProrate(r.monthlyRate, r.startDate);
      var total = round0((Number(r.serviceFee) || 0) + (Number(r.monthlyRate) || 0) + prorate);
      var cont = containerById(r.containerId);
      var actionBtn = existingInv
        ? '<button class="btn sm ' + (existingInv.status === "paid" ? "ghost" : "danger") + '" data-act="bill-new-toggle" data-id="' + esc(r.id) + '">' + (existingInv.status === "paid" ? "Paid — locked" : "Undo") + "</button>"
        : '<button class="btn sm primary" data-act="bill-new-toggle" data-id="' + esc(r.id) + '">Done</button>';
      return '<tr class="row-clickable' + (existingInv ? " row-done" : "") + '" data-act="bill-cust-expand" data-id="' + esc(r.customerId) + '" data-rental-id="' + esc(r.id) + '" style="cursor:pointer">' +
        "<td>" + billingNewRentalCustomerCellHtml(r.customerId, r.id) + "</td>" +
        '<td class="num money" style="color:var(--primary);font-weight:700">' + money(total, 0) + "</td>" +
        "<td>" + (esc(r.poNumber) || "—") + "</td>" +
        "<td>" + esc(cont ? cont.type : "—") + "</td>" +
        '<td class="num">' + money(r.monthlyRate, 0) + "</td>" +
        '<td class="num">' + money(r.serviceFee || 0, 0) + "</td>" +
        '<td class="num">' + money(prorate, 0) + "</td>" +
        "<td style=\"font-weight:600\">" + (esc(r.rentalNumber) || "—") + "</td>" +
        "<td>" + billingContainerCell(r.containerId) + "</td>" +
        "<td>" + (esc(r.shipToAddress) || "—") + "</td>" +
        '<td class="num" style="white-space:nowrap">' + fmtDate(r.startDate) + "</td>" +
        "<td>" + actionBtn + "</td></tr>" +
        (ui.billingExpandRentalId === r.id ? billingCustomerExpandRowHtml(r.customerId) : "");
    }).join("");
    if (!newList.length) newRows = '<tr><td colspan="12" class="empty-row">No new rentals delivered in ' + monthLabel(ym) + ".</td></tr>";

    /* Stage 2: returns — three independent sections */
    var pickupRows = retList.map(function (r) {
      var pickupInv = state.invoices.find(function (i) { return i.rentalId === r.id && i.kind === "pickup"; });
      var billedLocked = pickupInv && pickupInv.status === "paid";
      var billedBtn = '<button class="btn sm ' + (billedLocked ? "ghost" : (pickupInv ? "danger" : "primary")) + '" data-act="bill-return-billed" data-id="' + esc(r.id) + '">' + (billedLocked ? "Billed — locked" : pickupInv ? "Billed — undo" : "Mark billed") + "</button>";
      return '<tr class="' + (pickupInv ? "row-done" : "") + '">' +
        '<td class="cid">' + billingContainerCell(r.containerId) + "</td>" +
        "<td>" + (esc(r.rentalNumber) || "—") + "</td>" +
        "<td>" + customerCellHtml(r.customerId) + "</td>" +
        '<td class="num">' + fmtDate(r.endDate) + "</td>" +
        '<td class="num money">' + money(r.serviceFee || 0, 0) + "</td>" +
        '<td class="right">' + billedBtn + "</td></tr>";
    }).join("");
    if (!retList.length) pickupRows = '<tr><td colspan="6" class="empty-row">No returns recorded in ' + monthLabel(ym) + ".</td></tr>";

    var creditRows = retList.map(function (r) {
      var creditInv = state.invoices.find(function (i) { return i.rentalId === r.id && i.kind === "credit"; });
      var credit = returnProrateCredit(r.monthlyRate, r.endDate);
      var creditBtn = '<button class="btn sm ' + (creditInv ? "danger" : "primary") + '" data-act="bill-return-credit" data-id="' + esc(r.id) + '">' + (creditInv ? "Credit issued — undo" : "Issue credit") + "</button>";
      return '<tr class="' + (creditInv ? "row-done" : "") + '">' +
        '<td class="cid">' + billingContainerCell(r.containerId) + "</td>" +
        "<td>" + (esc(r.rentalNumber) || "—") + "</td>" +
        "<td>" + customerCellHtml(r.customerId) + "</td>" +
        '<td class="num">' + fmtDate(r.endDate) + "</td>" +
        '<td class="num" style="color:var(--credit)">-' + money(credit, 0) + "</td>" +
        '<td class="right">' + creditBtn + "</td></tr>";
    }).join("");
    if (!retList.length) creditRows = '<tr><td colspan="6" class="empty-row">No returns recorded in ' + monthLabel(ym) + ".</td></tr>";

    var removedRows = retList.map(function (r) {
      var removed = !r.addedToRecurring;
      var removedBtn = '<button class="btn sm ' + (removed ? "danger" : "primary") + '" data-act="bill-return-removed" data-id="' + esc(r.id) + '">' + (removed ? "Removed — undo" : "Remove from recurring") + "</button>";
      return '<tr class="' + (removed ? "row-done" : "") + '">' +
        '<td class="cid">' + billingContainerCell(r.containerId) + "</td>" +
        "<td>" + (esc(r.rentalNumber) || "—") + "</td>" +
        "<td>" + customerCellHtml(r.customerId) + "</td>" +
        '<td class="num">' + fmtDate(r.endDate) + "</td>" +
        '<td class="num">' + money(r.monthlyRate, 0) + "/mo</td>" +
        '<td class="right">' + removedBtn + "</td></tr>";
    }).join("");
    if (!retList.length) removedRows = '<tr><td colspan="6" class="empty-row">No returns recorded in ' + monthLabel(ym) + ".</td></tr>";

    /* Stage 3: needs recurring — stays visible after marking, for confirmation this month */
    var pendingRows = pendingList.map(function (r) {
      var elapsed = monthsElapsedCalendar(r.startDate, today());
      var done = r.addedToRecurring;
      var actionBtn = done
        ? '<button class="btn sm ghost" data-act="bill-mark-recurring" data-id="' + esc(r.id) + '">Done — undo</button>'
        : '<button class="btn sm primary" data-act="bill-mark-recurring" data-id="' + esc(r.id) + '">Mark added to recurring</button>';
      return '<tr class="' + (done ? "row-done" : "") + '">' +
        '<td class="cid">' + esc(containerLabel(r.containerId)) + "</td>" +
        "<td>" + customerCellHtml(r.customerId) + "</td>" +
        '<td class="num">' + fmtDate(r.startDate) + "</td>" +
        '<td class="num">' + elapsed + " mo</td>" +
        '<td class="num">' + money(r.monthlyRate, 0) + "</td>" +
        '<td class="right">' + actionBtn + "</td></tr>";
    }).join("");
    if (!pendingList.length) pendingRows = '<tr><td colspan="5" class="empty-row">Nothing waiting — everything eligible is already on the recurring system.</td></tr>';

    /* Stage 4: roster */
    var rosterRows = roster.map(function (r) {
      var existingInv = state.invoices.find(function (i) { return i.rentalId === r.id && i.kind === "recurring" && i.periodMonth === ym; });
      var cont = containerById(r.containerId);
      var actionBtn = existingInv
        ? '<button class="btn sm ' + (existingInv.status === "paid" ? "ghost" : "danger") + '" data-act="bill-recurring-toggle" data-id="' + esc(r.id) + '">' + (existingInv.status === "paid" ? "Paid — locked" : "Undo") + "</button>"
        : '<button class="btn sm primary" data-act="bill-recurring-toggle" data-id="' + esc(r.id) + '">Bill</button>';
      return '<tr class="' + (existingInv ? "row-done" : "") + '">' +
        "<td>" + customerCellHtml(r.customerId) + "</td>" +
        "<td>" + esc(cont ? cont.type : "—") + "</td>" +
        '<td class="num">' + money(r.monthlyRate, 0) + "</td>" +
        '<td class="cid">' + esc(containerLabel(r.containerId)) + "</td>" +
        "<td>" + (esc(r.shipToAddress) || "—") + "</td>" +
        '<td class="num">' + fmtDate(r.startDate) + "</td>" +
        '<td class="right">' + actionBtn + "</td></tr>";
    }).join("");
    if (!roster.length) rosterRows = '<tr><td colspan="7" class="empty-row">No rentals are flagged as on-recurring yet.</td></tr>';

    var newPendingCount = newList.filter(function (r) { return !invoiceExists(r.id, "initial", null); }).length;
    var pickupPendingCount = retList.filter(function (r) { return !state.invoices.some(function (i) { return i.rentalId === r.id && i.kind === "pickup"; }); }).length;
    var creditPendingCount = retList.filter(function (r) { return !state.invoices.some(function (i) { return i.rentalId === r.id && i.kind === "credit"; }); }).length;
    var removedPendingCount = retList.filter(function (r) { return r.addedToRecurring; }).length;
    var needsRecurringPendingCount = pendingList.filter(function (r) { return needsRecurringActionable(r, ym); }).length;
    var rosterPendingCount = roster.filter(function (r) { return !state.invoices.some(function (i) { return i.rentalId === r.id && i.kind === "recurring" && i.periodMonth === ym; }); }).length;

    v.innerHTML =
      '<div class="pagehead"><div><h2>Billing</h2><div class="sub">Your monthly close, in order — new rentals, pick-up fee billing, removed from recurring, needs to be added to recurring, return credit, and the recurring roster</div></div>' +
      '<div class="fld" style="min-width:180px"><label>Closing month</label><input class="in" id="bill-month" type="month" value="' + ym + '"></div></div>' +

      billingSectionHtml("new",
        '<span class="stage-badge">1</span>&nbsp; New rentals — ' + monthLabel(ym),
        "First invoice = service fee + full month + proration to the next calendar boundary.",
        (newList.some(function (r) { return !invoiceExists(r.id, "initial", null); }) ? '<button class="btn primary sm" data-act="bill-new-all">Mark all done</button>' : ""),
        '<div class="formula" style="margin-bottom:10px">proration = (monthly rate ÷ days in ' + monthLabel(ym) + ') × (days in month − delivery day)</div>' +
        '<div class="tablewrap"><table class="tbl tbl-newrentals" id="new-rentals-table">' +
        '<colgroup><col style="width:14%"><col style="width:6%"><col style="width:6%"><col style="width:7%"><col style="width:6%"><col style="width:6%"><col style="width:6%"><col style="width:5%"><col style="width:7%"><col style="width:14%"><col style="width:9%"><col style="width:6%"></colgroup>' +
        '<thead><tr><th>Customer</th><th>Total</th><th>PO</th><th>Size</th><th>Cost of rental</th><th>Cost of set up</th><th>Cost of prorate</th><th>Rental #</th><th>Container #</th><th>Ship to / address</th><th>Delivered</th><th></th></tr></thead><tbody>' + newRows + "</tbody></table></div>",
        newPendingCount) +

      billingSectionHtml("pickup",
        '<span class="stage-badge">2</span>&nbsp; Pick-up fee billing — ' + monthLabel(ym),
        "Bill the customer the pickup fee for each container returned this month.",
        "",
        '<div class="tablewrap"><table class="tbl"><thead><tr><th>Container</th><th>Rental #</th><th>Customer</th><th>Returned</th><th>Pickup fee</th><th></th></tr></thead><tbody>' + pickupRows + "</tbody></table></div>",
        pickupPendingCount) +

      billingSectionHtml("removed",
        '<span class="stage-badge">3</span>&nbsp; Removed from recurring — ' + monthLabel(ym),
        "Take each returned container off the standing recurring roster.",
        "",
        '<div class="tablewrap"><table class="tbl"><thead><tr><th>Container</th><th>Rental #</th><th>Customer</th><th>Returned</th><th>Rate</th><th></th></tr></thead><tbody>' + removedRows + "</tbody></table></div>",
        removedPendingCount) +

      billingSectionHtml("needs-recurring",
        '<span class="stage-badge">4</span>&nbsp; Needs to be added to recurring',
        "Rentals delivered in " + monthLabel(prevMonthKey(ym)) + " that haven't been returned, plus anything older still not flagged. Once marked, it stays here for confirmation but won't bill on the recurring roster until " + monthLabel(nextMonthKey(ym)) + ".",
        "",
        '<div class="tablewrap"><table class="tbl"><thead><tr><th>Container</th><th>Customer</th><th>Delivered</th><th>Age</th><th>Rate/mo</th><th></th></tr></thead><tbody>' + pendingRows + "</tbody></table></div>",
        needsRecurringPendingCount) +

      billingSectionHtml("credit",
        '<span class="stage-badge">5</span>&nbsp; Return credit — ' + monthLabel(ym),
        "Prorated credit for the unused portion of the month, off the originally requested return date.",
        "",
        '<div class="tablewrap"><table class="tbl"><thead><tr><th>Container</th><th>Rental #</th><th>Customer</th><th>Returned</th><th>Credit</th><th></th></tr></thead><tbody>' + creditRows + "</tbody></table></div>",
        creditPendingCount) +

      billingSectionHtml("roster",
        '<span class="stage-badge">6</span>&nbsp; Recurring roster',
        roster.length + " rentals on the accounting system's auto-bill. Generates a flat monthly invoice per unit for " + monthLabel(ym) + ".",
        '<button class="btn primary sm" data-act="bill-recurring-generate">Generate recurring invoices</button>',
        '<div class="tablewrap"><table class="tbl"><thead><tr><th>Customer</th><th>Size</th><th>Monthly rent</th><th>Container #</th><th>Ship to address</th><th>Delivered</th><th></th></tr></thead><tbody>' + rosterRows + "</tbody></table></div>",
        rosterPendingCount);
  }

  /* --------------------------- collections --------------------------- */
  function renderCollections(v) {
    var closedStages = ["Resolved", "Written Off", "Closed"];
    var openCount = state.collections.filter(function (c) { return closedStages.indexOf(c.stage) === -1; }).length;
    var closedCount = state.collections.length - openCount;
    v.innerHTML =
      '<div class="pagehead"><div><h2>Collections</h2><div class="sub">Legacy accounts receivable, with a working status flow and notes</div></div></div>' +
      '<div class="banner">These balances came from the old delinquent-accounts sheet, not from invoices generated in this tool. They don\'t affect the Billing tab\'s totals — use this list for collections follow-up and to true-up your accounting software.</div>' +
      '<div class="kpis" id="coll-kpis"></div>' +
      '<div class="toolbar"><div class="search"><input class="in" id="coll-search" placeholder="Search name, account #, stage…" value="' + esc(ui.collQ) + '"></div></div>' +
      '<div class="chips" style="margin-bottom:14px">' +
      '<button class="chip ' + (ui.collStageFilter === "open" ? "on" : "") + '" data-act="coll-filter" data-filter="open">Open (' + openCount + ")</button>" +
      '<button class="chip ' + (ui.collStageFilter === "closed" ? "on" : "") + '" data-act="coll-filter" data-filter="closed">Resolved / Written off / Closed (' + closedCount + ")</button>" +
      '<button class="chip ' + (ui.collStageFilter === "all" ? "on" : "") + '" data-act="coll-filter" data-filter="all">All (' + state.collections.length + ")</button></div>" +
      '<div id="coll-table"></div>' +
      '<div class="count" id="coll-count" style="margin-top:8px"></div>';
    renderCollectionsTable();
  }
  function renderCollectionsTable() {
    var term = ui.collQ.trim().toLowerCase();
    var closedStages = ["Resolved", "Written Off", "Closed"];
    var list = state.collections.filter(function (c) {
      if (ui.collStageFilter === "open" && closedStages.indexOf(c.stage) !== -1) return false;
      if (ui.collStageFilter === "closed" && closedStages.indexOf(c.stage) === -1) return false;
      if (!term) return true;
      return [c.name, c.account, c.status, c.stage, c.phone, c.email, c.address].join(" ").toLowerCase().indexOf(term) !== -1;
    });
    list = list.slice().sort(function (a, b) { return (Number(b.balance) || 0) - (Number(a.balance) || 0); });
    var total = list.reduce(function (s, c) { return s + (Number(c.balance) || 0); }, 0);

    var rows = list.map(function (c) {
      var noteCount = (c.notes || []).length;
      var lastNote = noteCount ? c.notes[noteCount - 1] : null;
      return "<tr>" +
        '<td style="font-weight:600">' + esc(c.name) + '<div class="subline mono">' + esc(c.account) + "</div></td>" +
        '<td class="num money" style="color:var(--danger)">' + money(c.balance, 0) + "</td>" +
        '<td><select class="in coll-stage-select" data-id="' + esc(c.account) + '" style="min-width:170px">' + opt(COLLECTION_STAGES, c.stage || "New") + "</select></td>" +
        '<td class="muted" style="max-width:240px">' + (lastNote ? esc(lastNote.text) + '<div class="subline">' + fmtDate(lastNote.date) + "</div>" : "—") + "</td>" +
        '<td class="num">' + (esc(c.phone) || "—") + "</td>" +
        '<td class="right nowrap"><button class="btn sm ghost" data-act="coll-notes" data-id="' + esc(c.account) + '">Notes (' + noteCount + ")</button></td>" +
        "</tr>";
    }).join("");
    if (!list.length) rows = '<tr><td colspan="6" class="empty-row">No accounts match.</td></tr>';

    el("coll-kpis").innerHTML =
      '<div class="kpi" style="--accent:#b3382c"><div class="lbl">Accounts shown</div><div class="val">' + list.length + "</div></div>" +
      '<div class="kpi" style="--accent:#b3382c"><div class="lbl">Total balance shown</div><div class="val">' + moneyWhole(total) + "</div></div>";
    el("coll-table").innerHTML =
      '<div class="tablewrap"><table class="tbl"><thead><tr><th>Customer</th><th>Balance</th><th>Stage</th><th>Latest note</th><th>Phone</th><th></th></tr></thead><tbody>' +
      rows + "</tbody></table></div>";
    el("coll-count").textContent = "Showing " + list.length + " of " + state.collections.length;
  }

  function collectionNotesModal(accountId) {
    var c = collectionById(accountId);
    if (!c) return;
    var notes = (c.notes || []).slice().reverse();
    var notesHTML = notes.length
      ? '<div class="list">' + notes.map(function (n) {
          return '<div class="listrow" style="align-items:flex-start"><div><div>' + esc(n.text) + '</div><div class="subline mono">' + fmtDate(n.date) + "</div></div></div>";
        }).join("") + "</div>"
      : '<p class="muted" style="margin:0">No notes yet.</p>';
    openModal(esc(c.name) + " — notes",
      '<div class="muted" style="font-size:12.5px">Account ' + esc(c.account) + " · Balance " + money(c.balance, 0) + " · Stage: " + esc(c.stage || "New") + "</div>" +
      '<div class="fld"><label>Add a note</label><textarea class="in" id="coll-note-text" rows="3" placeholder="Left voicemail, promised payment by Friday…"></textarea></div>' +
      '<div class="fld"><label>History</label>' + notesHTML + "</div>",
      '<button class="btn" data-act="modal-close">Close</button>' +
      '<button class="btn primary" data-act="coll-note-add" data-id="' + esc(accountId) + '">Add note</button>');
  }

  function collectionById(id) {
    for (var i = 0; i < state.collections.length; i++) if (state.collections[i].account === id) return state.collections[i];
    return null;
  }
  function setCollectionStage(accountId, stage) {
    state.collections = state.collections.map(function (c) { return c.account === accountId ? Object.assign({}, c, { stage: stage }) : c; });
    persist();
    flash("Stage set to \u201c" + stage + "\u201d");
  }
  function addCollectionNote(accountId, text) {
    if (!text || !text.trim()) return flash("Write something before adding the note");
    state.collections = state.collections.map(function (c) {
      if (c.account !== accountId) return c;
      var notes = (c.notes || []).concat([{ id: uid(), date: today(), text: text.trim() }]);
      return Object.assign({}, c, { notes: notes });
    });
    persist();
  }

  /* --------------------------- contract haul --------------------------- */
  function haulById(id) {
    for (var i = 0; i < state.hauls.length; i++) if (state.hauls[i].id === id) return state.hauls[i];

      };
      Object.assign(obj, timingReadFields({ type: "q-dtype", date: "q-reqdate", hard: "q-harddate", note: "q-datenote" }));
      var priorSalesId = prior.category === "Sales" ? prior.salesContainerId : null;
      if (priorSalesId && priorSalesId !== obj.salesContainerId) {
        state.salescontainers = state.salescontainers.map(function (c) { return c.id === priorSalesId ? Object.assign({}, c, { status: "Available", reservedByQuoteId: null, reservedAt: null }) : c; });
      }
      if (category === "Sales" && obj.salesContainerId) {
        state.salescontainers = state.salescontainers.map(function (c) {
          return c.id === obj.salesContainerId ? Object.assign({}, c, { status: "Reserved", reservedByQuoteId: obj.id, reservedAt: (priorSalesId === obj.salesContainerId && c.reservedAt) ? c.reservedAt : today() }) : c;
        });

      var linkedCard = state.dispatchcards.find(function (c) { return c.sourceType === "quote" && c.sourceId === origId && !c.dispatcherConfirmed; });
      if (linkedCard) {
        state.dispatchcards = state.dispatchcards.map(function (c) {

          return Object.assign({}, c, {

            shipToAddress: category === "Contract Haul" ? "" : obj.shipToAddress,
            pickupAddress: category === "Contract Haul" ? obj.pickupAddress : "",

        containerType: item.containerType || TYPES[0], monthlyRate: item.monthlyRate || 0, serviceFee: item.serviceFee || 0,
        salesContainerId: item.salesContainerId || "", salePrice: item.salePrice || 0,

        pickupAddress: item.pickupAddress || "", haulAmount: item.haulAmount || 0,

    }

  function releaseQuoteSalesHold(q) {

      id: uid(), category: dispatchCatFromQuote(q), sourceType: "quote", sourceId: q.id,
      customerId: q.customerId, customerName: q.customerName,
      containerId: q.category === "Sales" ? (q.salesContainerId || "") : "",

      shipToAddress: q.category === "Contract Haul" ? "" : (q.shipToAddress || ""),

  function quoteApplyStatusTransition(quoteObj, oldStatus, newStatus) {
    if (oldStatus === newStatus) return;
    if (oldStatus === "Approved" && newStatus !== "Approved") {
      var toRemove = quoteLinkedUnconfirmedCard(quoteObj.id);
      if (toRemove) state.dispatchcards = state.dispatchcards.filter(function (c) { return c.id !== toRemove.id; });

    if (newStatus === "Declined" && oldStatus !== "Approved") {

    "dc-delete-reason-pick": function (t) {
      var reason = t.getAttribute("data-reason");
      el("dc-delete-reason").value = reason;
      Array.prototype.forEach.call(document.querySelectorAll("#dc-delete-reason-chips .chip"), function (chip) { chip.classList.remove("on"); });
      t.classList.add("on");
      el("dc-delete-other-wrap").style.display = reason === "Other" ? "block" : "none";
    },
    "dispatch-confirm-open": function (t) { dispatcherConfirmModal(dispatchCardById(t.getAttribute("data-id"))); },
    "dispatch-confirm-job": function (t) { dispatcherConfirmJob(t.getAttribute("data-id")); },
    "dispatch-view-mode": function (t) { ui.dispatchViewMode = t.getAttribute("data-mode"); render(); },
    "dispatch-nav-prev": function () { dispatchShiftRef(-1); render(); },
    "dispatch-nav-next": function () { dispatchShiftRef(1); render(); },
    "dispatch-nav-today": function () { ui.dispatchRefDate = today(); render(); },
    "dispatch-driver-filter": function (t) { ui.dispatchDriverFilter = t.getAttribute("data-driver"); render(); },
    "profile-add": function () { profileModal(null); },
    "profile-edit": function (t) { profileModal(profileByEmail(t.getAttribute("data-id"))); },
    "profile-del": function (t) { profileDel(t.getAttribute("data-id")); },
    "profile-save": function (t) { profileSave(t.getAttribute("data-id")); }
  };

  var OVERLAY_MOUSEDOWN_WAS_BACKDROP = false;
  document.addEventListener("mousedown", function (e) {
    OVERLAY_MOUSEDOWN_WAS_BACKDROP = !!(e.target.classList && e.target.classList.contains("overlay"));
  });
  document.addEventListener("click", function (e) {
    Array.prototype.forEach.call(document.querySelectorAll(".combo-list"), function (list) {
      if (!list.parentElement.contains(e.target)) list.style.display = "none";
    });
    if (e.target.classList && e.target.classList.contains("overlay")) {
      if (OVERLAY_MOUSEDOWN_WAS_BACKDROP) closeModal();
      return;
    }
    var node = e.target.closest("[data-act]");
    if (node) {
      var act = node.getAttribute("data-act");
      if (CLICK[act]) { e.preventDefault(); CLICK[act](node, e); }
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "fleet-search") { ui.fleetQ = e.target.value; renderFleetTable(); }
    else if (e.target.id === "rental-search") { ui.rentalQ = e.target.value; renderRentalsTable(); }
    else if (e.target.id === "cust-search") { ui.custQ = e.target.value; renderCustomersTable(); }
    else if (e.target.id === "coll-search") { ui.collQ = e.target.value; renderCollectionsTable(); }
    else if (e.target.id === "haul-search") { ui.haulQ = e.target.value; renderHaulTable(); }
    else if (e.target.id === "sales-bill-search") { ui.salesBillQ = e.target.value; renderSalesBillingTable(); }
    else if (e.target.id === "completed-jobs-search") { ui.completedJobsQ = e.target.value; renderCompletedJobsTable(); }
    else if (e.target.id === "sales-search") { ui.salesQ = e.target.value; renderSalesTable(); }
    else if (e.target.id === "quote-search") { ui.quoteQ = e.target.value; renderQuotesTable(); }
    else if (e.target.id === "r-cont-search") { el("r-cont").value = ""; renderContainerCombo(e.target.value); }
    else if (e.target.id === "r-cust-search") { el("r-cust").value = ""; renderCustomerCombo(e.target.value); }
    else if (e.target.id === "q-cust-search") { el("q-customer").value = ""; renderQuoteCustomerCombo(e.target.value); }
    else if (e.target.id === "q-cust-account") { el("q-customer").value = ""; renderQuoteAccountCombo(e.target.value); }
    else if (e.target.id === "q-salescont-search") { el("q-salescont").value = ""; el("q-bookvalue-wrap").style.display = "none"; renderSalesContainerCombo(e.target.value); }
    else if (e.target.id === "q-sales-spec-color") { updateSalesSpecMatchInfo(); }
    else if (e.target.classList.contains("addr-input")) { renderAddressCombo(e.target.id, e.target.value); }
  });

  document.addEventListener("dragstart", function (e) {
    var card = e.target.closest(".drag-card");
    if (!card) return;
    e.dataTransfer.setData("text/plain", card.getAttribute("data-id"));
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("dcard-dragging");
  });
  document.addEventListener("dragend", function (e) {
    var card = e.target.closest(".drag-card");
    if (card) card.classList.remove("dcard-dragging");
    Array.prototype.forEach.call(document.querySelectorAll(".dcal-day-over"), function (el2) { el2.classList.remove("dcal-day-over"); });
  });
  document.addEventListener("dragover", function (e) {
    if (e.target.closest("[data-date]") || e.target.closest(".drag-card")) e.preventDefault();
  });
  document.addEventListener("dragenter", function (e) {
    var day = e.target.closest("[data-date]");
    if (day) day.classList.add("dcal-day-over");
  });
  document.addEventListener("dragleave", function (e) {
    var day = e.target.closest("[data-date]");
    if (day && !day.contains(e.relatedTarget)) day.classList.remove("dcal-day-over");
  });
  document.addEventListener("drop", function (e) {
    var draggedId = e.dataTransfer.getData("text/plain");
    Array.prototype.forEach.call(document.querySelectorAll(".dcal-day-over"), function (el2) { el2.classList.remove("dcal-day-over"); });
    if (!draggedId) return;
    var targetCard = e.target.closest(".drag-card");
    var targetDay = e.target.closest("[data-date]");
    if (targetCard && targetCard.getAttribute("data-id") !== draggedId) {
      e.preventDefault();
      dispatchReorderCard(draggedId, targetCard.getAttribute("data-id"));
    } else if (targetDay && targetDay.getAttribute("data-date")) {
      e.preventDefault();
      var driverAttr = targetDay.hasAttribute("data-driver") ? targetDay.getAttribute("data-driver") : null;
      dispatchMoveCard(draggedId, targetDay.getAttribute("data-date"), driverAttr);
    }
  });

  document.addEventListener("focusout", function (e) {
    if (e.target.classList && e.target.classList.contains("verify-addr")) {
      var id = e.target.id;
      setTimeout(function () { var f = el(id); if (f && document.activeElement !== f) verifyAddressField(id); }, 400);
    }
  });

  document.addEventListener("focusin", function (e) {
    if (e.target.id === "r-cont-search") renderContainerCombo(e.target.value);
    else if (e.target.id === "r-cust-search") renderCustomerCombo(e.target.value);
    else if (e.target.id === "q-cust-search") renderQuoteCustomerCombo(e.target.value);
    else if (e.target.id === "q-cust-account") renderQuoteAccountCombo(e.target.value);
    else if (e.target.id === "q-salescont-search") renderSalesContainerCombo(e.target.value);
    else if (e.target.classList.contains("addr-input")) renderAddressCombo(e.target.id, e.target.value);
  });

  document.addEventListener("change", function (e) {
    if (e.target.id === "fleet-type") { ui.fleetType = e.target.value; renderFleetTable(); }
    else if (e.target.classList.contains("rental-end-input")) { rentalEndDateEdit(e.target.getAttribute("data-id"), e.target.value); }
    else if (e.target.id === "bill-month") { ui.billMonth = e.target.value; render(); }

    else if (e.target.classList.contains("coll-stage-select")) { setCollectionStage(e.target.getAttribute("data-id"), e.target.value); renderCollections(el("view")); }
    else if (e.target.id === "q-category") { quoteShowGroup(e.target.value); }
    else if (e.target.id === "dc-hard") { dispatchHardWarnRefresh(); }
    else if (e.target.classList.contains("dtype-sel")) { dtypeApply(e.target); }
    else if (e.target.id === "q-cust-account" || e.target.id === "q-cust-search") {
      if (!el("q-customer").value) {
        var tv = e.target.value.trim().toLowerCase();
        var hit = tv && state.customers.filter(function (c) { return (e.target.id === "q-cust-account" ? (c.accountNumber || "") : c.name).trim().toLowerCase() === tv; });
        if (hit && hit.length === 1) quoteFillCustomer(hit[0]);
      }
    }
    else if (e.target.id === "q-container-type") {
      var rate = rateForType(e.target.value);
      if (rate) { el("q-monthly-rate").value = rate.monthlyRate; el("q-service-fee").value = rate.serviceFee; }
    }
    else if (e.target.classList.contains("qs-type")) {
      var rate2 = rateForType(e.target.value), n2 = e.target.getAttribute("data-n");
      if (rate2) { el("qs-rate-" + n2).value = rate2.monthlyRate; el("qs-fee-" + n2).value = rate2.serviceFee; }
    }
    else if (e.target.id === "q-sales-spec-type" || e.target.id === "q-sales-spec-condition") { updateSalesSpecMatchInfo(); }
    else if (e.target.id === "p-role") {
      var isDriverRole = e.target.value === "driver";
      el("p-email-wrap").style.display = isDriverRole ? "none" : "";
      el("p-username-wrap").style.display = isDriverRole ? "" : "none";
    }
    else if (e.target.id === "labels-select-all") { labelsToggleAll(e.target.checked); }
    else if (e.target.id === "q-sameaddr-check") {
      if (e.target.checked && QUOTE_LINE_ITEMS.length) el(quoteShipToFieldId()).value = QUOTE_LINE_ITEMS[0].shipToAddress || "";
    }
    else if (e.target.id === "q-haul-samepickup-check") {
      if (e.target.checked && QUOTE_LINE_ITEMS.length) el("q-pickup").value = QUOTE_LINE_ITEMS[0].pickupAddress || "";
    }
    else if (e.target.id === "q-haul-sameship-check") {
      if (e.target.checked && QUOTE_LINE_ITEMS.length) el("q-haul-shipto").value = QUOTE_LINE_ITEMS[0].shipToAddress || "";
    }
  });

  /* --------------------------- init --------------------------- */
  bootAuth();
})();
</script>
</body>
</html>
