<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Western Mobile Storage — Rental & Billing Tracker</title>
<style>
  :root {
    --bg:#eef1ec; --surface:#ffffff; --surface-2:#f5f7f3; --ink:#161d18;
    --muted:#5b6b60; --line:#d6ddd5; --primary:#004812; --primary-2:#0a691e;
    --stripe:#51B948;
    --ok:#1f7a4d; --ok-bg:#e4f1ea; --rent:#1f5fa8; --rent-bg:#e6eef8;
    --warn:#946610; --warn-bg:#f6ecd3; --off:#55626f; --off-bg:#e7ecf0;
    --danger:#b3382c; --danger-bg:#f7e3e0; --credit:#6b4fa0; --credit-bg:#ece6f5;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:14px; line-height:1.45; }
  .mono { font-family:var(--mono); }

  header.top { background:var(--primary); color:#fff; border-top:4px solid var(--stripe); padding:14px 20px 0; }
  .top-row { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:40px; height:34px; border-radius:6px; background:var(--stripe); display:flex; align-items:center; justify-content:center; color:var(--primary); font-weight:800; font-family:var(--mono); font-size:12px; letter-spacing:-0.5px; }
  .brand h1 { font-size:17px; margin:0; letter-spacing:.2px; font-weight:650; }
  .brand p { margin:0; font-size:11.5px; color:#b7d2c1; letter-spacing:.4px; text-transform:uppercase; }
  nav.tabs { display:flex; gap:2px; margin-top:14px; overflow-x:auto; }
  nav.tabs button { background:transparent; border:0; color:#a8c6b3; padding:11px 16px; cursor:pointer; font-size:13.5px; font-weight:550; border-bottom:3px solid transparent; white-space:nowrap; font-family:var(--font); }
  nav.tabs button:hover { color:#fff; }
  nav.tabs button.on { color:#fff; border-bottom-color:var(--stripe); }

  main { max-width:1260px; margin:0 auto; padding:22px 20px 60px; }
  .pagehead { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .pagehead h2 { margin:0; font-size:19px; font-weight:650; }
  .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  .count { font-size:12.5px; color:var(--muted); margin-left:6px; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; position:relative; overflow:hidden; }
  .kpi::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent,var(--primary)); }
  .kpi .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:600; }
  .kpi .val { font-size:24px; font-weight:700; font-family:var(--mono); margin-top:4px; letter-spacing:-.5px; }
  .kpi .hint { font-size:12px; color:var(--muted); margin-top:2px; }

  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:720px){ .grid2 { grid-template-columns:1fr; } }
  @media (max-width:480px){ .overlay { padding:12px 8px; } .modal-body { max-height:80vh; } }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:18px; position:relative; }
  .panel-pending-badge { position:absolute; top:-10px; right:-10px; background:var(--danger); color:#fff; font-size:12px; font-weight:700; min-width:24px; height:24px; border-radius:12px; display:flex; align-items:center; justify-content:center; padding:0 7px; box-shadow:0 2px 6px rgba(0,0,0,.25); border:2px solid var(--surface); }
  .panel h3 { margin:0 0 4px; font-size:14px; font-weight:650; }
  .panel .panel-sub { margin:0 0 12px; font-size:12.5px; color:var(--muted); }
  .panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .stage-badge { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--primary); color:#fff; font-size:11.5px; font-weight:700; font-family:var(--mono); flex-shrink:0; }

  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .search { flex:1; min-width:180px; }
  input.in, select.in, textarea.in { width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:7px; font-size:13.5px; font-family:var(--font); background:#fff; color:var(--ink); }
  input.in:focus, select.in:focus, textarea.in:focus { outline:2px solid var(--primary-2); outline-offset:-1px; border-color:var(--primary-2); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:20px; padding:6px 12px; font-size:12.5px; cursor:pointer; font-weight:550; font-family:var(--font); }
  .chip.on { background:var(--primary); color:#fff; border-color:var(--primary); }

  .btn { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:7px; padding:8px 14px; font-size:13px; cursor:pointer; font-weight:600; font-family:var(--font); display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { background:var(--surface-2); }
  .btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  .btn.primary:hover { background:var(--primary-2); }
  .btn.ghost { background:transparent; }
  .btn.danger { color:var(--danger); border-color:#e8c4bf; }
  .btn.danger:hover { background:var(--danger-bg); }
  .btn.sm { padding:5px 9px; font-size:12px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  .qf-grid { display:grid; grid-template-columns:minmax(300px,1fr) minmax(0,1.7fr); gap:20px; align-items:start; }
  .qf-col { padding:18px; display:grid; gap:14px; }
  .qf-h { margin:0; font-size:15px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .qf-foot { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  @media (max-width:900px){ .qf-grid { grid-template-columns:1fr; } }
  .pill-asap { color:#b3261e; }
  .qgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; }
  .qcard { border:1px solid var(--line); border-radius:10px; padding:12px; background:#fff; display:grid; gap:8px; cursor:grab; align-content:start; }
  .qcard-hard { border-color:#c0392b; box-shadow:inset 3px 0 0 #c0392b; }
  .qcard-top { display:flex; justify-content:space-between; align-items:center; }
  .qcard-cust { font-weight:700; font-size:15px; }
  .qcard-sum { color:var(--muted); font-size:13px; }
  .qcard-date { background:#f3f6f1; border-radius:8px; padding:8px 10px; display:grid; gap:3px; }
  .qcard-datelbl { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .qcard-dateval { font-weight:700; font-size:15px; }
  .qcard-note { font-size:12.5px; }
  .qcard-actions { display:flex; gap:8px; }
  .chk-line { display:flex; align-items:center; gap:6px; font-weight:500; text-transform:none; letter-spacing:0; font-size:13px; color:var(--ink); }
  .chk-line input { width:auto; }
  .hard-warn { background:#fdecea; border:1px solid #e3a59f; color:#8a1f14; border-radius:8px; padding:10px 12px; font-size:13px; font-weight:600; }
  .dcard-city { font-weight:700; white-space:nowrap; }
  .csec { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; background:#f7f9f5; display:grid; gap:10px; }
  .csec-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .csec-actions { display:flex; gap:8px; flex-wrap:wrap; }
  #q-rental-sections-wrap { display:grid; gap:8px; }
  .tablewrap { border:1px solid var(--line); border-radius:10px; background:#fff; overflow-x:auto; }
  table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th { text-align:left; padding:10px 12px; background:#d7ded2; color:var(--ink); font-size:11px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0; z-index:2; box-shadow:0 2px 4px rgba(0,0,0,.1); }
  .tbl td { padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  .tbl-newrentals { table-layout:fixed; width:100%; }
  .tbl-newrentals th { white-space:normal; padding:8px 6px; font-size:10px; line-height:1.3; }
  .tbl-newrentals td { padding:8px 6px; word-wrap:break-word; overflow-wrap:break-word; }
  .tbl tr:last-child td { border-bottom:0; }
  .tbl tbody tr:hover td { background:var(--surface-2); }
  .tbl tbody tr.row-done td { background:var(--ok-bg); }
  .tbl tbody tr.row-done:hover td { background:var(--ok-bg); filter:brightness(0.97); }
  .cid { font-family:var(--mono); font-weight:600; letter-spacing:.5px; }
  .num { font-family:var(--mono); }
  .money { font-family:var(--mono); font-weight:650; }
  .muted { color:var(--muted); }
  .right { text-align:right; }
  .nowrap { white-space:nowrap; }
  .subline { font-size:11.5px; color:var(--muted); margin-top:2px; }

  .badge { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:650; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .badge::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .b-ok { color:var(--ok); background:var(--ok-bg); }
  .b-rent { color:var(--rent); background:var(--rent-bg); }
  .b-warn { color:var(--warn); background:var(--warn-bg); }
  .b-off { color:var(--off); background:var(--off-bg); }
  .b-danger { color:var(--danger); background:var(--danger-bg); }
  .b-credit { color:var(--credit); background:var(--credit-bg); }

  .empty { text-align:center; padding:44px 20px; color:var(--muted); }
  .empty h3 { color:var(--ink); margin:0 0 6px; font-size:16px; }
  .empty p { margin:0 0 16px; }
  .empty-row { text-align:center; padding:22px; color:var(--muted); font-size:13px; }

  .overlay { position:fixed; inset:0; background:rgba(15,25,35,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto; }
  .modal { background:#fff; border-radius:12px; width:100%; max-width:560px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .overlay.full { padding:0; align-items:stretch; }
  .modal.modal-full { max-width:none; width:100%; height:100%; border-radius:0; display:flex; flex-direction:column; }
  .modal.modal-full .modal-body { max-height:none; flex:1; }
  .modal.modal-lg { max-width:1100px; }
  .modal.modal-lg .modal-body { max-height:80vh; }
  @media (max-width:1160px){ .modal.modal-lg { max-width:calc(100vw - 48px); } }
  .modal-head { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  .modal-head h3 { margin:0; font-size:16px; }
  .modal-body { padding:20px; display:grid; gap:14px; max-height:70vh; overflow-y:auto; }
  .modal-foot { padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
  .x { border:0; background:transparent; font-size:22px; line-height:1; cursor:pointer; color:var(--muted); }
  .fld label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.4px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:8px; font-size:13.5px; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; transition:opacity .2s; pointer-events:none; max-width:80vw; }
  .toast.show { opacity:1; }
  .toast.err { background:var(--danger); }
  .list { display:flex; flex-direction:column; gap:8px; }
  .listrow { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
  .bar { height:8px; background:var(--surface-2); border-radius:20px; overflow:hidden; margin-top:8px; }
  .bar > span { display:block; height:100%; background:var(--primary); }
  .savenote { font-size:11.5px; color:#b7d2c1; white-space:nowrap; }
  .banner { background:var(--warn-bg); color:var(--warn); border:1px solid #e9d6a3; border-radius:8px; padding:10px 14px; font-size:12.5px; margin-bottom:16px; }
  .formula { background:var(--surface-2); border:1px dashed var(--line); border-radius:8px; padding:8px 11px; font-size:12px; color:var(--muted); font-family:var(--mono); }
  .combo-wrap { position:relative; }
  .combo-list { position:absolute; z-index:60; background:#fff; border:1px solid var(--line); border-radius:8px; margin-top:4px; max-height:220px; overflow-y:auto; width:100%; box-shadow:0 8px 20px rgba(0,0,0,.15); display:none; }
  .combo-item { padding:8px 11px; cursor:pointer; font-size:13px; }
  .combo-item:hover { background:var(--surface-2); }
  .combo-empty { padding:8px 11px; color:var(--muted); font-size:12.5px; }
  .cal-panel { padding:10px 12px; width:260px; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-weight:650; font-size:13px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; font-size:12.5px; }
  .cal-dow { color:var(--muted); font-weight:650; padding:4px 0; }
  .cal-day { padding:6px 0; border-radius:6px; cursor:pointer; }
  .cal-day:hover { background:var(--surface-2); }
  .cal-sel { background:var(--primary); color:#fff; }
  .cal-today:not(.cal-sel) { border:1px solid var(--primary); }
  .cal-foot { display:flex; justify-content:space-between; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
  .dispatch-cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .dispatch-cal.wk5 { grid-template-columns:repeat(5,1fr); }
  .dcal-dow { font-size:11px; font-weight:650; color:var(--muted); text-align:center; padding:4px 0; text-transform:uppercase; }
  .dcal-day { min-height:88px; border:1px solid var(--line); border-radius:8px; padding:5px; background:#fff; overflow:hidden; }
  .dcal-day.dcal-empty { background:transparent; border-color:transparent; }
  .dcal-day.dcal-today { border-color:var(--primary); border-width:2px; }
  .dcal-daynum { font-size:11px; color:var(--muted); font-weight:650; margin-bottom:3px; }
  .dcard { font-size:11px; padding:2px 6px; border-radius:5px; margin-bottom:3px; cursor:pointer; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dcard-rental-delivery { background:var(--ok-bg); color:var(--ok); }
  .dcard-rental-return { background:var(--danger-bg); color:var(--danger); }
  .dcard-sales { background:var(--rent-bg); color:var(--rent); }
  .dcard-contract-haul { background:var(--credit-bg); color:var(--credit); }
  .dcard[draggable="true"] { cursor:grab; }
  .dcard-dragging { opacity:.35; }
  .dcal-day-over { background:var(--surface-2); border-color:var(--primary-2); border-style:dashed; }
  .dcard-released { box-shadow:0 0 0 2px currentColor inset; }
  .driver-badge { display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:50%; color:#fff; font-size:9.5px; font-weight:700; margin-right:4px; flex-shrink:0; vertical-align:-2px; }
  .driver-lane { margin-bottom:18px; }
  .driver-lane:last-child { margin-bottom:0; }
  .driver-lane-label { display:flex; align-items:center; margin:0 0 8px; font-size:12.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:650; }
  .quickadd { margin-top:8px; padding:10px; border:1px dashed var(--line); border-radius:8px; display:grid; gap:8px; }
  .quote-group { display:grid; gap:14px; }
</style>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <div class="logo">WMS</div>
        <div>
          <h1>Western Mobile Storage</h1>
          <p>Rental &amp; Billing Tracker · Oregon's Trusted Source</p>
        </div>
      </div>
      <div class="savenote" id="savenote"></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-act="tab" data-tab="dashboard">Dashboard</button>
      <button data-act="tab" data-tab="fleet">Fleet</button>
      <button data-act="tab" data-tab="customers">Customers</button>
      <button data-act="tab" data-tab="rentals">Rentals</button>
      <button data-act="tab" data-tab="billing">Billing</button>
      <button data-act="tab" data-tab="collections">Collections</button>
      <button data-act="tab" data-tab="haul">Contract Haul</button>
      <button data-act="tab" data-tab="sales-inv">Sales Inventory</button>
      <button data-act="tab" data-tab="new-quote">New Quote</button>
      <button data-act="tab" data-tab="quotes">Quotes</button>
      <button data-act="tab" data-tab="dispatch">Dispatch</button>
      <button data-act="tab" data-tab="sales-billing">Sales Billing</button>
      <button data-act="tab" data-tab="completed-jobs">Completed Jobs</button>
      <button data-act="tab" data-tab="rate-card">Rate Card</button>
      <button data-act="tab" data-tab="driver-access">Driver Access</button>
    </nav>
  </header>
  <main id="view"></main>
  <footer style="max-width:1260px;margin:0 auto;padding:0 20px 32px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:16px">
    <strong style="color:var(--ink)">Western Mobile Storage</strong> · A family company of Rexius ·
    1275 Bailey Hill Rd, Eugene, OR 97402 · Yard: 86315 College View Rd, Eugene, OR 97405 · 541-342-1835
  </footer>
  <div id="overlay-root"></div>
  <div class="toast" id="toast"></div>

  /* ------------------------- date / proration math ------------------------- */
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); } // m is 1-indexed month
  function parts(dateStr) {
    var p = dateStr.split("-");
    return { y: +p[0], m: +p[1], d: +p[2] };
  }
  function daysInMonthOf(dateStr) { var p = parts(dateStr); return daysInMonth(p.y, p.m); }
  function dayOfMonth(dateStr) { return parts(dateStr).d; }
  // Proration: daily rate = monthly fee / actual days in that calendar month.
  function dailyRate(monthlyFee, dateStr) { return (Number(monthlyFee) || 0) / daysInMonthOf(dateStr); }
  function remainingDaysAfter(dateStr) { return daysInMonthOf(dateStr) - dayOfMonth(dateStr); }
  function nextMonthProrate(monthlyFee, deliveryDateStr) {
    return round0(dailyRate(monthlyFee, deliveryDateStr) * remainingDaysAfter(deliveryDateStr));
  }
  function returnProrateCredit(monthlyFee, returnDateStr) {
    return round0(dailyRate(monthlyFee, returnDateStr) * remainingDaysAfter(returnDateStr));
  }
  function round0(n) { return Math.round(n); }
  function round0(n) { return Math.round(n); }
  function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
  function monthsElapsedCalendar(startDateStr, asOfStr) {
    var s = parts(startDateStr), a = parts(asOfStr);
    return (a.y * 12 + a.m) - (s.y * 12 + s.m);
  }

  /* ------------------------- supabase sync ------------------------- */
  function toSnake(s) { return s.replace(/([A-Z])/g, "_$1").toLowerCase(); }
  function toCamel(s) { return s.replace(/_([a-z])/g, function (_, c) { return c.toUpperCase(); }); }
  function rowToDb(row) {
    var out = {};
    Object.keys(row).forEach(function (k) { out[toSnake(k)] = row[k]; });
    return out;
  }
  function rowFromDb(row) {
    var out = {};
    Object.keys(row).forEach(function (k) { out[toCamel(k)] = row[k]; });
    return out;
  }
  var TABLE_KEYS = { containers: "id", customers: "id", rentals: "id", invoices: "id", collections: "account", hauls: "id", salescontainers: "id", quotes: "id", dispatchcards: "id", profiles: "email", salesinvoices: "id", ratecards: "id" };

  async function syncTable(table, rows) {
    var idField = TABLE_KEYS[table];
    var localIds = rows.map(function (r) { return r[idField]; });
    var sel = await sb.from(table).select(idField);
    if (sel.error) throw sel.error;
    var existingIds = (sel.data || []).map(function (r) { return r[idField]; });
    var toDelete = existingIds.filter(function (id) { return localIds.indexOf(id) === -1; });
    if (toDelete.length) {
      var del = await sb.from(table).delete().in(idField, toDelete);
      if (del.error) throw del.error;
    }
    if (rows.length) {
      var up = await sb.from(table).upsert(rows.map(rowToDb));
      if (up.error) throw up.error;
    }
  }

  async function persist() {
    if (!sb) return;
    if (AUTH.role === "driver") return; // drivers write via driverUpdateCardFields (a direct UPDATE), not the upsert-based sync below
    try {
      await Promise.all([
        syncTable("containers", state.containers),
        syncTable("customers", state.customers),
        syncTable("rentals", state.rentals),
        syncTable("invoices", state.invoices),
        syncTable("collections", state.collections),
        syncTable("hauls", state.hauls),
        syncTable("salescontainers", state.salescontainers),
        syncTable("quotes", state.quotes),
        syncTable("dispatchcards", state.dispatchcards),
        syncTable("profiles", state.profiles),
        syncTable("salesinvoices", state.salesinvoices),
        syncTable("ratecards", state.ratecards)
      ]);
    } catch (e) {
      flash("Sync error — your change may not have saved: " + (e.message || e), true);
    }
  }

  async function loadAllFromSupabase() {
    try {
      var profRes = await sb.from("profiles").select("*");
      if (profRes.error) throw profRes.error;
      state.profiles = profRes.data.map(rowFromDb);
      applyMyProfile();

      if (AUTH.role === "driver") {
        // RLS scopes dispatchcards to just today's released cards for this driver, and containers/
        // salescontainers to read-only (needed so a scanned code can be checked against real inventory).
        var driverResults = await Promise.all([
          sb.from("dispatchcards").select("*"),
          sb.from("containers").select("*"),
          sb.from("salescontainers").select("*")
        ]);
        state.dispatchcards = driverResults[0].error ? [] : driverResults[0].data.map(rowFromDb);
        state.containers = driverResults[1].error ? [] : driverResults[1].data.map(rowFromDb);
        state.salescontainers = driverResults[2].error ? [] : driverResults[2].data.map(rowFromDb);
        state.customers = []; state.rentals = []; state.invoices = [];
        state.collections = []; state.hauls = []; state.quotes = [];
        render();
        return;
      }

      var results = await Promise.all([
        sb.from("containers").select("*"),
        sb.from("customers").select("*"),
        sb.from("rentals").select("*"),
        sb.from("invoices").select("*"),
        sb.from("collections").select("*"),
        sb.from("hauls").select("*"),
        sb.from("salescontainers").select("*"),
        sb.from("quotes").select("*"),
        sb.from("dispatchcards").select("*"),
        sb.from("salesinvoices").select("*"),
        sb.from("ratecards").select("*")
      ]);
      for (var i = 0; i < results.length; i++) if (results[i].error) throw results[i].error;
      state.containers = results[0].data.map(rowFromDb);
      state.customers = results[1].data.map(rowFromDb);
      state.rentals = results[2].data.map(rowFromDb);
      state.invoices = results[3].data.map(rowFromDb);
      state.collections = results[4].data.map(rowFromDb).map(migrateCollectionRecord);
      state.hauls = results[5].data.map(rowFromDb);
      state.salescontainers = results[6].data.map(rowFromDb);
      state.quotes = results[7].data.map(rowFromDb);
      state.dispatchcards = results[8].data.map(rowFromDb);
      state.salesinvoices = results[9].data.map(rowFromDb);
      state.ratecards = results[10].data.map(rowFromDb);
      render();
    } catch (e) {
      flash("Couldn't load data from Supabase: " + (e.message || e), true);
    }
  }

  var realtimeChannel = null, refreshTimers = {};
  function subscribeRealtime() {
    if (!sb) return;
    if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
    function refresh(table) {
      clearTimeout(refreshTimers[table]);
      refreshTimers[table] = setTimeout(function () { refetchTable(table); }, 500);
    }
    var channel = sb.channel("wms-tracker-changes");
    if (AUTH.role === "driver") {
      channel.on("postgres_changes", { event: "*", schema: "public", table: "dispatchcards" }, function () { refresh("dispatchcards"); });
    } else {
      channel
        .on("postgres_changes", { event: "*", schema: "public", table: "containers" }, function () { refresh("containers"); })
        .on("postgres_changes", { event: "*", schema: "public", table: "customers" }, function () { refresh("customers"); })
        .on("postgres_changes", { event: "*", schema: "public", table: "rentals" }, function () { refresh("rentals"); })
        .on("postgres_changes", { event: "*", schema: "public", table: "invoices" }, function () { refresh("invoices"); })
        .on("postgres_changes", { event: "*", schema: "public", table: "collections" }, function () { refresh("collections"); })
        .on("postgres_changes", { event: "*", schema: "public", table: "hauls" }, function () { refresh("hauls"); })
        .on("postgres_changes", { event: "*", schema: "public", table: "salescontainers" }, function () { refresh("salescontainers"); })
        .on("postgres_changes", { event: "*", schema: "public", table: "quotes" }, function () { refresh("quotes"); })
        .on("postgres_changes", { event: "*", schema: "public", table: "dispatchcards" }, function () { refresh("dispatchcards"); })
        .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, function () { refresh("profiles"); })
        .on("postgres_changes", { event: "*", schema: "public", table: "salesinvoices" }, function () { refresh("salesinvoices"); })
        .on("postgres_changes", { event: "*", schema: "public", table: "ratecards" }, function () { refresh("ratecards"); });
    }
    realtimeChannel = channel.subscribe();
  }
  async function refetchTable(table) {
    var res = await sb.from(table).select("*");
    if (res.error) return;
    var mapped = res.data.map(rowFromDb);
    if (table === "collections") mapped = mapped.map(migrateCollectionRecord);
    state[table] = mapped;
    if (table === "profiles") applyMyProfile();
    render();
  }

  /* ------------------------- domain ------------------------- */
  function activeRentalOf(cid) {
    for (var i = 0; i < state.rentals.length; i++)
      if (state.rentals[i].containerId === cid && !state.rentals[i].endDate) return state.rentals[i];
    return null;
  }
  function effStatus(c) { return activeRentalOf(c.id) ? "Rented" : (c.status || "Available"); }
  function customerById(id) {
    for (var i = 0; i < state.customers.length; i++) if (state.customers[i].id === id) return state.customers[i];
    return null;
  }
  function customerName(id) { var c = customerById(id); return c ? c.name : "—"; }
  function customerAccountNumber(id) { var c = customerById(id); return c && c.accountNumber ? c.accountNumber : ""; }
  function containerLabel(id) {
    for (var i = 0; i < state.containers.length; i++) if (state.containers[i].id === id) return state.containers[i].id;
    return id;
  }
  function containerById(id) {
    for (var i = 0; i < state.containers.length; i++) if (state.containers[i].id === id) return state.containers[i];
    return null;
  }
  function findContainerCaseInsensitive(pool, rawId) {
    var list = pool === "sales" ? state.salescontainers : state.containers;
    var target = (rawId || "").trim().toLowerCase();
    for (var i = 0; i < list.length; i++) if ((list[i].id || "").trim().toLowerCase() === target) return list[i];
    return null;
  }

  /* --------------------------- QR labels --------------------------- */
  function qrCodeHtml(text) {
    if (!window.qrcode) return '<div class="muted" style="font-size:11px">QR library didn\u2019t load — check your internet connection and reload.</div>';
    var qr = window.qrcode(0, "M");
    qr.addData(text);
    qr.make();
    if (typeof qr.createSvgTag === "function") return qr.createSvgTag(4, 4);
    return qr.createImgTag(4, 4);
  }
  function labelsModal(pool) {
    var list = pool === "sales" ? state.salescontainers : state.containers;
    var rows = list.map(function (c) {
      return '<label class="listrow" style="cursor:pointer"><span><input type="checkbox" class="label-check" value="' + esc(c.id) + '" style="width:auto;margin-right:8px">' + esc(c.id) + " · " + esc(c.type) + "</span></label>";
    }).join("");
    if (!list.length) rows = '<div class="empty-row">Nothing here to print labels for yet.</div>';
    openModal("Print QR Labels",

      '<div class="fld"><label style="display:flex;align-items:center;gap:8px;font-weight:500;text-transform:none;letter-spacing:0"><input type="checkbox" id="labels-select-all" style="width:auto"> Select all (' + list.length + ")</label></div>" +

  function labelsToggleAll(checked) {

  }
  function printLabelItems(items, closeModalFirst) {

      "@media print { body{padding:0;} }" +
      "</style></head><body><div class=\"qrgrid\">" + labelsHtml + "</div></body></html>"
    );

  function labelsPrint(pool) {

    if (!ids.length) return flash("Pick at least one container to print");

  function rentalById(id) {
    for (var i = 0; i < state.rentals.length; i++) if (state.rentals[i].id === id) return state.rentals[i];
    return null;
  }
  function isOverdue(inv) { return inv.status === "unpaid" && inv.dueDate < today(); }
  function badge(status, overdue) {
    var map = { Available: "b-ok", Rented: "b-rent", Maintenance: "b-warn", "Out of Service": "b-off", Paid: "b-ok", Unpaid: "b-warn", Credit: "b-credit", Yes: "b-ok", Pending: "b-warn", Draft: "b-warn", Driver: "b-rent", Staff: "b-ok", Approved: "b-ok" };
    var cls = overdue ? "b-danger" : (map[status] || "b-off");
    return '<span class="badge ' + cls + '">' + (overdue ? "Overdue" : esc(status)) + "</span>";
  }

  function metrics() {
    var total = state.containers.length, rented = 0, available = 0, maint = 0;
    state.containers.forEach(function (c) {
      var s = effStatus(c);
      if (s === "Rented") rented++;
      else if (s === "Available") available++;
      else if (s === "Maintenance") maint++;
    });
    var mrr = 0;
    state.rentals.forEach(function (r) { if (!r.endDate) mrr += Number(r.monthlyRate) || 0; });
    var outstanding = 0, overdue = [], overdueAmt = 0;
    state.invoices.forEach(function (i) {
      if (i.status === "unpaid") { outstanding += Number(i.amount) || 0; if (isOverdue(i)) { overdue.push(i); overdueAmt += Number(i.amount) || 0; } }
    });
    var byType = TYPES.map(function (t) {
      return { t: t, n: state.containers.filter(function (c) { return c.type === t; }).length };
    }).filter(function (x) { return x.n; });
    var collTotal = 0;
    state.collections.forEach(function (c) { collTotal += Number(c.balance) || 0; });
    var pendingRecurring = state.rentals.filter(function (r) { return needsRecurringActionable(r, nowMonth()); }).length;
    return {
      total: total, rented: rented, available: available, maint: maint, mrr: mrr,
      outstanding: outstanding, overdue: overdue, overdueAmt: overdueAmt,
      util: total ? Math.round((rented / total) * 100) : 0, byType: byType,
      collTotal: collTotal, collCount: state.collections.length, pendingRecurring: pendingRecurring
    };
  }

  function needsRecurringActionable(r, refYm) {
    if (r.endDate || r.addedToRecurring) return false;
    var isPrevMonth = monthKey(r.startDate) === prevMonthKey(refYm);
    var isStale = monthsElapsedCalendar(r.startDate, refYm) >= RECURRING_STALE_MONTHS;
    return isPrevMonth || isStale;
  }
  function needsRecurringVisible(r, refYm) {
    if (r.endDate) return false;
    if (r.addedToRecurring) return r.recurringSetMonth === refYm;
    return needsRecurringActionable(r, refYm);
  }

  /* ------------------------- real data loader ------------------------- */
  function migrateCollectionRecord(c) {
    if (c.stage && Array.isArray(c.notes)) return c;
    var seedParts = [];
    if (c.status) seedParts.push(c.status);
    if (c.lastContact) seedParts.push("Last contact: " + c.lastContact);
    if (c.containersOnSite) seedParts.push("Containers on site: " + c.containersOnSite);
    var seedText = seedParts.length ? seedParts.join(" — ") : "Imported from the prior delinquent-accounts sheet.";
    return Object.assign({}, c, {
      stage: c.stage || "New",
      notes: Array.isArray(c.notes) ? c.notes : [{ id: uid(), date: today(), text: seedText }]
    });
  }

  function loadRealData() {
    if (sb && !confirm("This will replace everything currently in the shared database for the whole team with the original spreadsheet seed data. Continue?")) return;
    state.containers = REAL_RENTAL_LOG.containers.slice();
    state.customers = REAL_RENTAL_LOG.customers.slice();
    state.rentals = REAL_RENTAL_LOG.rentals.slice();

    commit();
  }

  function resetAll() {

      ? "Erase all containers, customers, rentals, invoices, collections, contract haul, sales inventory, quote, dispatch, and sales billing data for the WHOLE TEAM in the shared database? This can't be undone. (Driver/staff access records and the rate card are kept.)"

  /* =====================================================================
     RENDER
  ===================================================================== */
  function renderInner() {
    if (AUTH.state === "logged-in" && AUTH.role === "driver") {
      renderAuthBar();
      renderDriverView();
      return;
    }
    checkSalesHolds();
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
      b.classList.toggle("on", b.getAttribute("data-tab") === ui.tab);
    });

    var empty = state.containers.length === 0 && state.customers.length === 0;
    var v = el("view");
    if (empty) {
      v.innerHTML =
        '<div class="card empty">' +
        "<h3>Your yard is empty</h3>" +
        "<p>Load your real rental log data to get started, or add records by hand.</p>" +
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn primary" data-act="load-sample">Load Western Mobile Storage rental data</button>' +
        '<button class="btn" data-act="tab" data-tab="fleet">Add my first container</button>' +
        "</div></div>";
      return;
    }

    if (ui.tab === "dashboard") renderDashboard(v);
    else if (ui.tab === "fleet") renderFleet(v);
    else if (ui.tab === "customers") renderCustomers(v);
    else if (ui.tab === "rentals") renderRentals(v);
    else if (ui.tab === "billing") renderBilling(v);
    else if (ui.tab === "collections") renderCollections(v);
    else if (ui.tab === "haul") renderHaul(v);
    else if (ui.tab === "sales-inv") renderSalesInv(v);
    else if (ui.tab === "new-quote") renderNewQuote(v);
    else if (ui.tab === "quotes") renderQuotes(v);
    else if (ui.tab === "dispatch") renderDispatch(v);
    else if (ui.tab === "sales-billing") renderSalesBilling(v);
    else if (ui.tab === "completed-jobs") renderCompletedJobs(v);
    else if (ui.tab === "rate-card") renderRateCard(v);
    else if (ui.tab === "driver-access") renderDriverAccess(v);

    v.insertAdjacentHTML("beforeend",
      '<div style="margin-top:28px;display:flex;justify-content:flex-end">' +
      '<button class="btn ghost sm muted" data-act="reset-all">Reset all data</button></div>');
  }
  function render() {
    var scrollY = window.scrollY;
    renderInner();
    window.scrollTo(0, scrollY);
  }

  /* --------------------------- dashboard --------------------------- */
  function renderDashboard(v) {
    var m = metrics();
    function kpi(lbl, val, hint, color) {
      return '<div class="kpi" style="--accent:' + color + '"><div class="lbl">' + lbl + '</div><div class="val">' + val + "</div>" +
        (hint ? '<div class="hint">' + hint + "</div>" : "") + "</div>";
    }
    var overdue = m.overdue.slice().sort(function (a, b) { return a.dueDate.localeCompare(b.dueDate); }).slice(0, 6);
    var maintList = state.containers.filter(function (c) { var s = effStatus(c); return s === "Maintenance" || s === "Out of Service"; }).slice(0, 6);

    var overdueHTML = overdue.length === 0
      ? '<p class="muted" style="margin:0">Nothing overdue. Nice.</p>'
      : '<div class="list">' + overdue.map(function (i) {
          return '<div class="listrow"><div><div style="font-weight:600">' + esc(customerName(i.customerId)) + "</div>" +
            '<div class="muted mono" style="font-size:12px">' + esc(i.number) + " · due " + i.dueDate + "</div></div>" +
            '<span class="money" style="color:var(--danger)">' + money(i.amount, 0) + "</span></div>";
        }).join("") +
        '<button class="btn sm" style="align-self:flex-start;margin-top:4px" data-act="tab" data-tab="billing">Go to billing →</button></div>';

    var byTypeHTML = m.byType.map(function (x) {
      return '<div><div style="display:flex;justify-content:space-between;font-size:13px"><span>' + esc(x.t) + '</span><span class="mono muted">' + x.n + "</span></div>" +
        '<div class="bar"><span style="width:' + (x.n / m.total * 100) + '%"></span></div></div>';
    }).join("");

    var maintHTML = maintList.length === 0 ? "" :
      '<h3 style="margin-top:18px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">Out of service / maintenance</h3><div class="list">' +
      maintList.map(function (c) { return '<div class="listrow"><span class="cid">' + esc(c.id) + "</span>" + badge(effStatus(c)) + "</div>"; }).join("") + "</div>";

    v.innerHTML =
      '<div class="pagehead"><div><h2>Dashboard</h2><div class="sub">Snapshot of your fleet and money owed</div></div></div>' +
      '<div class="kpis">' +
        kpi("Fleet size", m.total, m.available + " available now", "#004812") +
        kpi("Utilization", m.util + "%", m.rented + " on rent", "#1f5fa8") +
        kpi("Monthly recurring", moneyWhole(m.mrr), "from active rentals", "#1f7a4d") +
        kpi("Outstanding", money(m.outstanding, 0), m.overdue.length + " invoice(s) overdue", "#946610") +
        kpi("Overdue balance", money(m.overdueAmt, 0), "past due date", "#b3382c") +
        kpi("Needs recurring setup", m.pendingRecurring, "see Billing → Add to recurring", "#946610") +
        kpi("Legacy AR", moneyWhole(m.collTotal), m.collCount + " account(s) — see Collections", "#946610") +
      "</div>" +
      '<div class="grid2">' +
        '<div class="panel" style="margin-bottom:0"><h3 style="text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-size:13px">Needs attention — overdue</h3>' + overdueHTML + "</div>" +
        '<div class="panel" style="margin-bottom:0"><h3 style="text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-size:13px">Fleet by type</h3><div class="list">' + byTypeHTML + "</div>" + maintHTML + "</div>" +
      "</div>";
  }

  /* ----------------------------- fleet ----------------------------- */
  function renderFleet(v) {
    v.innerHTML =
      '<div class="pagehead"><div><h2>Fleet<span class="count">' + state.containers.length + ' units</span></h2>' +
      '<div class="sub">Every container tracked, and where it stands</div></div>' +
      '<div style="display:flex;gap:8px">' +
      '<button class="btn" data-act="fleet-import">Import</button>' +
      '<button class="btn" data-act="labels-open" data-pool="fleet">Print QR Labels</button>' +
      '<button class="btn primary" data-act="fleet-add">+ Add container</button></div></div>' +
      '<div class="toolbar">' +
      '<div class="search"><input class="in" id="fleet-search" placeholder="Search ID, location, customer…" value="' + esc(ui.fleetQ) + '"></div>' +
      '<select class="in" id="fleet-type" style="width:auto"><option value="">All types</option>' + opt(TYPES, ui.fleetType) + "</select></div>" +
      '<div class="chips" style="margin-bottom:14px" id="fleet-chips">' +
      ["All", "Available", "Rented", "Maintenance", "Out of Service"].map(function (s) {
        return '<button class="chip ' + (ui.fleetFilter === s ? "on" : "") + '" data-act="fleet-filter" data-status="' + esc(s) + '">' + s + "</button>";
      }).join("") + "</div>" +
      '<div id="fleet-table"></div>' +
      '<div class="count" id="fleet-count" style="margin-top:8px"></div>';
    renderFleetTable();
  }

  function fleetList() {
    var term = ui.fleetQ.trim().toLowerCase();
    return state.containers.filter(function (c) {
      var s = effStatus(c);
      if (ui.fleetFilter !== "All" && s !== ui.fleetFilter) return false;
      if (ui.fleetType && c.type !== ui.fleetType) return false;
      if (!term) return true;
      var r = activeRentalOf(c.id);
      var cust = r ? customerName(r.customerId) : "";
      var rentalNum = (r ? r.rentalNumber : c.rentalNumber) || "";
      return [c.id, c.type, c.location, c.grade, cust, rentalNum].join(" ").toLowerCase().indexOf(term) !== -1;
    });
  }

  function renderFleetTable() {
    var list = fleetList();
    var rows = list.map(function (c) {
      var r = activeRentalOf(c.id);
      return "<tr>" +
        '<td class="cid">' + esc(c.id) + "</td>" +
        "<td>" + esc(c.type) + "</td>" +
        '<td class="muted">' + esc(c.grade) + "</td>" +
        "<td>" + (esc(c.location) || "—") + "</td>" +
        "<td>" + badge(effStatus(c)) + "</td>" +
        "<td>" + (r ? esc(customerName(r.customerId)) : '<span class="muted">—</span>') + "</td>" +
        '<td class="num">' + (esc((r ? r.rentalNumber : c.rentalNumber) || "") || "—") + "</td>" +
        '<td class="num">' + (r ? money(r.monthlyRate, 0) : "—") + "</td>" +
        '<td class="right nowrap">' +
        '<button class="btn sm ghost" data-act="print-one-label" data-pool="fleet" data-id="' + esc(c.id) + '">QR</button> ' +
        '<button class="btn sm ghost" data-act="fleet-edit" data-id="' + esc(c.id) + '">Edit</button>' +
        '<button class="btn sm ghost danger" data-act="fleet-del" data-id="' + esc(c.id) + '">Del</button></td></tr>';
    }).join("");
    if (!list.length) rows = '<tr><td colspan="9" class="empty-row">No containers match.</td></tr>';
    el("fleet-table").innerHTML =
      '<div class="tablewrap"><table class="tbl"><thead><tr>' +
      "<th>Container ID</th><th>Type</th><th>Grade</th><th>Location</th><th>Status</th><th>Customer</th><th>Rental #</th><th>Rate/mo</th><th></th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
    el("fleet-count").textContent = "Showing " + list.length + " of " + state.containers.length;
  }

  function fleetModal(editing) {
    var f = editing || { id: "", type: TYPES[0], grade: GRADES[1], location: "", status: "Available", notes: "", rentalNumber: "" };
    var onRent = editing ? activeRentalOf(editing.id) : null;
    var statusField = onRent
      ? '<div class="muted" style="font-size:12.5px">On rent to ' + esc(customerName(onRent.customerId)) + ' — status stays “Rented” until the rental is ended.</div>'
      : '<div class="fld"><label>Status</label><select class="in" id="f-status">' + opt(MANUAL_STATUSES, f.status) + "</select></div>";
    var rentalNumVal = onRent ? (onRent.rentalNumber || "") : (f.rentalNumber || "");
    var rentalField = '<div class="fld"><label>Rental #' + (onRent ? " (active rental)" : " (reference)") + '</label><input class="in mono" id="f-rentalnum" value="' + esc(rentalNumVal) + '"></div>';
    openModal(editing ? "Edit container" : "Add container",
      '<div class="fld"><label>Container ID</label><input class="in mono" id="f-id" placeholder="REXU 1234567" value="' + esc(f.id) + '"></div>' +
      (onRent ? '<div class="muted" style="font-size:12px">Renaming the ID here will automatically update its active rental and invoice history to match.</div>' : "") +
      '<div class="row2"><div class="fld"><label>Type</label><select class="in" id="f-type">' + opt(TYPES, f.type) + "</select></div>" +
      '<div class="fld"><label>Grade</label><select class="in" id="f-grade">' + opt(GRADES, f.grade) + "</select></div></div>" +
      '<div class="fld"><label>Location / ship-to</label><div class="combo-wrap"><input class="in addr-input" id="f-loc" placeholder="Yard A — Eugene" value="' + esc(f.location) + '"><div class="combo-list" id="f-loc-list"></div></div><div class="subline" id="f-loc-hint" style="color:var(--warn)"></div></div>' +
      statusField + rentalField +
      '<div class="fld"><label>Notes</label><textarea class="in" id="f-notes" rows="2">' + esc(f.notes || "") + "</textarea></div>",
      '<button class="btn" data-act="modal-close">Cancel</button>' +
      '<button class="btn primary" data-act="fleet-save" data-id="' + esc(editing ? editing.id : "") + '">' + (editing ? "Save changes" : "Add container") + "</button>");
  }

  function fleetSave(origId) {
    var id = el("f-id").value.trim();
    if (!id) return flash("Container ID is required");
    var dup = state.containers.some(function (c) { return c.id.toLowerCase() === id.toLowerCase() && c.id !== origId; });
    if (dup) return flash("That container ID already exists");
    var prior = state.containers.find(function (c) { return c.id === origId; }) || {};
    var obj = {
      id: id, type: el("f-type").value, grade: el("f-grade").value,
      location: el("f-loc").value.trim(),
      status: el("f-status") ? el("f-status").value : prior.status || "Available",
      notes: el("f-notes") ? el("f-notes").value.trim() : prior.notes || "",
      rentalNumber: prior.rentalNumber || ""
    };
    var renamed = origId && origId !== id;
    if (origId) state.containers = state.containers.map(function (c) { return c.id === origId ? obj : c; });
    else state.containers.unshift(obj);
    if (renamed) {
      state.rentals = state.rentals.map(function (r) { return r.containerId === origId ? Object.assign({}, r, { containerId: id }) : r; });
      state.invoices = state.invoices.map(function (i) { return i.containerId === origId ? Object.assign({}, i, { containerId: id }) : i; });
    }
    if (el("f-rentalnum")) {
      var newRentalNum = el("f-rentalnum").value.trim();
      var activeR = activeRentalOf(id);
      if (activeR) {
        state.rentals = state.rentals.map(function (r) { return r.id === activeR.id ? Object.assign({}, r, { rentalNumber: newRentalNum }) : r; });
      } else {
        state.containers = state.containers.map(function (c) { return c.id === id ? Object.assign({}, c, { rentalNumber: newRentalNum }) : c; });
      }
    }
    closeModal();
    flash(origId ? (renamed ? "Container updated and renamed everywhere it's referenced" : "Container updated") : "Container added");
    commit();
  }

  function fleetDel(id) {
    if (activeRentalOf(id)) return flash("End the active rental before deleting this unit");
    if (!confirm("Delete " + id + "?")) return;
    state.containers = state.containers.filter(function (c) { return c.id !== id; });
    flash("Container deleted");
    commit();
  }

  function fleetImportModal() {
    openModal("Import containers",
      '<div class="muted" style="font-size:12.5px">Paste one container per line: <span class="mono">ID, Type, Grade, Location</span>. Only ID is required; a header row is fine. Duplicate IDs are skipped.</div>' +
      '<textarea class="in mono" id="imp-text" rows="9" placeholder="REXU 1234567, 40&#39; Standard, Cargo-Worthy, Yard A — Eugene&#10;CASU 7654321, 20&#39; Standard, Wind &amp; Watertight, Yard B — Portland"></textarea>',
      '<button class="btn" data-act="modal-close">Cancel</button>' +
      '<button class="btn primary" data-act="fleet-import-run">Import</button>');
  }

  function fleetImportRun() {
    var text = el("imp-text").value;
    var lines = text.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
    var existing = {};
    state.containers.forEach(function (c) { existing[c.id.toLowerCase()] = 1; });
    var added = [];
    lines.forEach(function (line, idx) {
      var cells = line.split(/[\t,]/).map(function (s) { return s.trim(); });
      if (idx === 0 && /^id\b/i.test(cells[0])) return;
      var id = cells[0], type = cells[1], grade = cells[2], location = cells[3];
      if (!id || existing[id.toLowerCase()]) return;
      existing[id.toLowerCase()] = 1;
      added.push({
        id: id, type: TYPES.indexOf(type) !== -1 ? type : "Other",
        grade: GRADES.indexOf(grade) !== -1 ? grade : GRADES[1],
        location: location || "", status: "Available", notes: ""
      });
    });
    if (!added.length) return flash("No new containers found to import");
    state.containers = added.concat(state.containers);
    closeModal();
    flash("Imported " + added.length + " container(s)");
    commit();
  }

  /* --------------------------- customers --------------------------- */
  function renderCustomers(v) {
    v.innerHTML =
      '<div class="pagehead"><div><h2>Customers<span class="count">' + state.customers.length + '</span></h2><div class="sub">Who you rent to</div></div>' +
      '<button class="btn primary" data-act="cust-add">+ Add customer</button></div>' +
      '<div class="toolbar"><div class="search"><input class="in" id="cust-search" placeholder="Search name, account #, email…" value="' + esc(ui.custQ) + '"></div></div>' +
      '<div id="cust-table"></div>' +
      '<div class="count" id="cust-count" style="margin-top:8px"></div>';
    renderCustomersTable();
  }
  function renderCustomersTable() {
    function activeCount(id) { return state.rentals.filter(function (r) { return r.customerId === id && !r.endDate; }).length; }
    var term = ui.custQ.trim().toLowerCase();
    var list = state.customers.filter(function (c) {
      if (!term) return true;
      return [c.name, c.accountNumber, c.email, c.phone].join(" ").toLowerCase().indexOf(term) !== -1;
    });
    var rows = list.map(function (c) {
      return "<tr>" +
        '<td style="font-weight:600">' + esc(c.name) + "</td>" +
        '<td class="mono">' + (esc(c.accountNumber) || "—") + "</td>" +
        "<td>" + (esc(c.contact) || "—") + "</td>" +
        '<td class="muted">' + (esc(c.email) || "—") + "</td>" +
        '<td class="num">' + (esc(c.phone) || "—") + "</td>" +
        '<td class="num">' + activeCount(c.id) + "</td>" +
        '<td class="right nowrap">' +
        '<button class="btn sm ghost" data-act="cust-edit" data-id="' + esc(c.id) + '">Edit</button>' +
        '<button class="btn sm ghost danger" data-act="cust-del" data-id="' + esc(c.id) + '">Del</button></td></tr>';
    }).join("");
    if (!list.length) rows = '<tr><td colspan="7" class="empty-row">No customers match.</td></tr>';
    el("cust-table").innerHTML =
      '<div class="tablewrap"><table class="tbl"><thead><tr><th>Name</th><th>Account #</th><th>Contact</th><th>Email</th><th>Phone</th><th>Active rentals</th><th></th></tr></thead><tbody>' +
      rows + "</tbody></table></div>";
    el("cust-count").textContent = "Showing " + list.length + " of " + state.customers.length;
  }

  function custModal(editing) {
    var c = editing || { name: "", accountNumber: "", contact: "", email: "", phone: "", billingAddress: "", notes: "" };
    openModal(editing ? "Edit customer" : "Add customer",
      '<div class="row2"><div class="fld"><label>Business / customer name</label><input class="in" id="c-name" value="' + esc(c.name) + '"></div>' +
      '<div class="fld"><label>Account #</label><input class="in mono" id="c-account" value="' + esc(c.accountNumber) + '"></div></div>' +
      '<div class="row2"><div class="fld"><label>Contact person</label><input class="in" id="c-contact" value="' + esc(c.contact) + '"></div>' +
      '<div class="fld"><label>Phone</label><input class="in" id="c-phone" value="' + esc(c.phone) + '"></div></div>' +
      '<div class="fld"><label>Email</label><input class="in" id="c-email" value="' + esc(c.email) + '"></div>' +
      '<div class="fld"><label>Billing address</label><div class="combo-wrap"><input class="in addr-input" id="c-baddr" value="' + esc(c.billingAddress) + '"><div class="combo-list" id="c-baddr-list"></div></div><div class="subline" id="c-baddr-hint" style="color:var(--warn)"></div></div>' +
      '<div class="fld"><label>Notes</label><textarea class="in" id="c-notes" rows="2">' + esc(c.notes) + "</textarea></div>",
      '<button class="btn" data-act="modal-close">Cancel</button>' +
      '<button class="btn primary" data-act="cust-save" data-id="' + esc(editing ? editing.id : "") + '">Save</button>');
  }

  function custSave(id) {
    var name = el("c-name").value.trim();
    if (!name) return flash("Customer name is required");
    var obj = {
      name: name, accountNumber: el("c-account").value.trim(), contact: el("c-contact").value.trim(),
      email: el("c-email").value.trim(), phone: el("c-phone").value.trim(),
      billingAddress: el("c-baddr").value.trim(), notes: el("c-notes").value.trim()
    };
    if (id) state.customers = state.customers.map(function (c) { return c.id === id ? Object.assign({}, c, obj) : c; });
    else { obj.id = uid(); state.customers.unshift(obj); }
    closeModal();
    flash(id ? "Customer updated" : "Customer added");
    commit();
  }

  function custDel(id) {
    var active = state.rentals.some(function (r) { return r.customerId === id && !r.endDate; });
    if (active) return flash("This customer has active rentals — end them first");
    var c = customerById(id);
    if (!confirm("Delete " + (c ? c.name : "customer") + "?")) return;
    state.customers = state.customers.filter(function (x) { return x.id !== id; });
    flash("Customer deleted");
    commit();
  }

  /* ---------------------------- rentals ---------------------------- */
  function renderRentals(v) {
    var activeN = state.rentals.filter(function (r) { return !r.endDate; }).length;
    var endedN = state.rentals.length - activeN;
    v.innerHTML =
      '<div class="pagehead"><div><h2>Rentals</h2><div class="sub">Active agreements drive availability and billing</div></div>' +
      '<button class="btn primary" data-act="rental-start">+ Start rental</button></div>' +
      '<div class="toolbar"><div class="search"><input class="in" id="rental-search" placeholder="Search container, customer, account #, PO, rental #…" value="' + esc(ui.rentalQ) + '"></div></div>' +
      '<div class="chips" style="margin-bottom:14px">' +
      '<button class="chip ' + (ui.rentalView === "active" ? "on" : "") + '" data-act="rental-view" data-view="active">Active (' + activeN + ")</button>" +
      '<button class="chip ' + (ui.rentalView === "ended" ? "on" : "") + '" data-act="rental-view" data-view="ended">Ended (' + endedN + ")</button></div>" +
      '<div id="rentals-table"></div>' +
      '<div class="count" id="rentals-count" style="margin-top:8px"></div>';
    renderRentalsTable();
  }

  function rentalsList() {
    var term = ui.rentalQ.trim().toLowerCase();
    return state.rentals.filter(function (r) { return ui.rentalView === "active" ? !r.endDate : r.endDate; })
      .filter(function (r) {
        if (!term) return true;
        var cust = customerById(r.customerId);
        var haystack = [
          containerLabel(r.containerId), cust ? cust.name : "", cust ? cust.accountNumber : "",
          r.poNumber, r.rentalNumber
        ].join(" ").toLowerCase();
        return haystack.indexOf(term) !== -1;
      })
      .sort(function (a, b) { return (b.startDate || "").localeCompare(a.startDate || ""); });
  }

  function renderRentalsTable() {
    var shown = rentalsList();
    var rows = shown.map(function (r) {
      var refs = [];
      if (r.rentalNumber) refs.push("Rental " + r.rentalNumber);
      if (r.poNumber) refs.push("PO " + r.poNumber);
      var endCell = r.endDate
        ? '<input class="in mono rental-end-input" type="date" data-id="' + esc(r.id) + '" value="' + esc(r.endDate) + '" style="min-width:150px">'
        : '<span class="badge b-rent">active</span>';
      var returnCard = rentalScheduledReturnCard(r.id);
      var returnAction = "";
      if (!r.endDate) {
        returnAction = returnCard
          ? '<span class="badge b-danger">Return scheduled' + (returnCard.scheduledDate ? " " + fmtDate(returnCard.scheduledDate) : "") + "</span>"
          : '<button class="btn sm" data-act="rental-schedule-return" data-id="' + esc(r.id) + '">Schedule return</button>';
      }
      return "<tr>" +
        '<td class="cid">' + esc(containerLabel(r.containerId)) + "</td>" +
        "<td>" + esc(customerName(r.customerId)) +
        (refs.length ? '<div class="subline mono">' + esc(refs.join(" · ")) + "</div>" : "") + "</td>" +
        '<td class="num">' + money(r.monthlyRate, 0) + "</td>" +
        '<td class="num muted">' + (r.serviceFee ? money(r.serviceFee, 0) : "—") + "</td>" +

  var GMAPS_STATE = { geocoder: null, loading: null };
  function googleGeocoder() {
    if (!GOOGLE_MAPS_API_KEY) return Promise.resolve(null);
    if (GMAPS_STATE.geocoder) return Promise.resolve(GMAPS_STATE.geocoder);
    if (!GMAPS_STATE.loading) {
      GMAPS_STATE.loading = new Promise(function (resolve) {
        function ready() {
          if (window.google && google.maps && google.maps.Geocoder) { GMAPS_STATE.geocoder = new google.maps.Geocoder(); resolve(GMAPS_STATE.geocoder); }
          else resolve(null);
        }
        if (window.google && google.maps && google.maps.Geocoder) return ready();
        window.__gmapsReady = ready;
        var sc = document.createElement("script");
        sc.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(GOOGLE_MAPS_API_KEY) + "&callback=__gmapsReady";
        sc.async = true;

  function cleanGoogleAddress(a) { return (a || "").replace(/,\s*(USA|United States)$/i, ""); }
  function normAddr(a) { return (a || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
  async function verifyAddressField(fieldId) {
    var input = el(fieldId), hintEl = el(fieldId + "-hint");
    if (!input || !hintEl || !GOOGLE_MAPS_API_KEY) return;
    var typed = input.value.trim();
    if (!typed || !looksLikeAddress(typed)) return;
    hintEl.style.color = "var(--muted, #6b7a6b)";
    hintEl.textContent = "Checking with Google\u2026";
    var geocoder = await googleGeocoder();
    if (!geocoder) { hintEl.textContent = ""; return; }
    geocoder.geocode({ address: typed, componentRestrictions: { country: "US" } }, function (results, status) {
      if (!el(fieldId) || el(fieldId).value.trim() !== typed) return; // field changed while we waited
      var h = el(fieldId + "-hint");
      if (!h) return;
      var lst = el(fieldId + "-list"); if (lst) lst.style.display = "none"; // done typing: don't let the suggestions cover the result
      if (status === "OK" && results && results.length) {
        var r = results[0], found = cleanGoogleAddress(r.formatted_address);

        var exact = !r.partial_match && street;
        var same = normAddr(found) === normAddr(typed);
        h.style.color = exact ? "var(--primary-2, #1b6b34)" : "var(--warn)";
        h.innerHTML = (exact ? "\u2713 Verified by Google" : "\u26A0 Google only found a close match") +

      } else if (status === "ZERO_RESULTS") {

      flash("Undid the " + monthLabel(ym) + " recurring invoice" + (r0 ? " for " + customerName(r0.customerId) : ""));
      commit();
    } else {
      var r = rentalById(rentalId);
      if (!r) return;
      var meta = invoiceMeta(r);
      state.invoices.push({
        id: uid(), number: nextInvoiceNumber(), kind: "recurring", rentalId: r.id, containerId: r.containerId, customerId: r.customerId,
        accountNumber: meta.accountNumber, poNumber: meta.poNumber, rentalNumber: meta.rentalNumber,
        periodMonth: ym, baseRate: r.monthlyRate, amount: Number(r.monthlyRate) || 0,
        issueDate: ym + "-01", dueDate: ym + "-15", status: "unpaid", paidDate: null
      });
      flash("Generated recurring invoice for " + customerName(r.customerId));
      commit();
    }
  }

  function customerCellHtml(customerId) {

  function billingSectionHtml(key, titleHtml, subHtml, actionHtml, bodyHtml, pendingCount) {

      '<div><h3>' + titleHtml + ' <span style="color:var(--muted);font-weight:500;font-size:12px">' + (collapsed ? "\u25B8 Show" : "\u25BE Hide") + "</span></h3>" +

      (incomplete ? '<div class="subline"><a href="#" data-act="bill-cust-expand" data-id="' + esc(customerId) + '" data-rental-id="' + esc(rentalId) + '" style="color:var(--warn);font-weight:600">\u26A0 Missing info — add details</a></div>' : "");

      '<div class="row2"><div class="fld"><label>Account #</label><input class="in" id="bill-cust-account" value="' + esc(c.accountNumber || "") + '"></div>' +
      '<div class="fld"><label>Email</label><input class="in" id="bill-cust-email" value="' + esc(c.email || "") + '"></div></div>' +
